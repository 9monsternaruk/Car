<html lang="th">
<head>

    <script>

                extend: {

    <style>

</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-primary text-white shadow-md sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 sm:py-3.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <div class="bg-white/20 p-1.5 sm:p-2 rounded-lg shrink-0"><i class="fa-solid fa-car-side text-lg sm:text-xl"></i></div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-xl font-semibold leading-tight truncate">ระบบทะเบียนรถลูกบ้าน</h1>
                    <p class="text-[10px] sm:text-xs text-blue-200 truncate">Vehicle Registry & Directory</p>

            <div class="flex items-center shrink-0">

    <!-- Mobile Tabs -->
    <div class="lg:hidden bg-white shadow-sm sticky top-[53px] sm:top-[60px] z-10 border-b border-slate-200 flex">
        <button id="tabSearch" class="flex-1 py-3 text-sm font-medium text-primary border-b-2 border-primary transition-colors flex items-center justify-center gap-2" onclick="window.switchTab('search')">
            <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
        </button>
        <button id="tabAdd" class="flex-1 py-3 text-sm font-medium text-slate-400 border-b-2 border-transparent transition-colors flex items-center justify-center gap-2" onclick="window.switchTab('add')">
            <i class="fa-solid fa-file-circle-plus"></i> เพิ่ม/แก้ไขรถ
        </button>
    </div>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- SECTION A: ค้นหาข้อมูล (Search) -->
            <div id="sectionSearch" class="lg:col-span-7 flex flex-col gap-6">
                <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-secondary"></i> ค้นหาทะเบียนรถ / บ้านเลขที่
                    </h2>
                    <div class="relative flex items-center">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-solid fa-search text-slate-400"></i>
                        </div>
                        <input type="text" id="searchInput" 
                            class="bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl focus:ring-secondary focus:border-secondary block w-full pl-11 pr-24 p-3.5 transition-all outline-none" 
                            placeholder="พิมพ์ข้อมูล หรือกดรูปกล้อง..." autocomplete="off">
                        
                        <div class="absolute inset-y-0 right-0 flex items-center pr-2 gap-1">
                            <button id="clearSearchBtn" class="p-2 text-slate-400 hover:text-slate-600 hidden cursor-pointer transition-colors rounded-full hover:bg-slate-200">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                            <button id="scanCameraBtnSearch" class="p-2 text-white bg-secondary hover:bg-blue-700 transition-colors rounded-lg shadow-sm flex items-center justify-center cursor-pointer h-9 w-10" title="สแกนป้ายด้วยกล้อง">
                                <i class="fa-solid fa-camera text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="resultsContainer" class="flex flex-col gap-3">
                    <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300 shadow-sm">
                        <i class="fa-solid fa-car text-4xl mb-3 text-slate-200"></i>
                        <p>พิมพ์ข้อมูลเพื่อเริ่มการค้นหา</p>
                    </div>

            </div>

            <!-- SECTION B: บันทึก/แก้ไขข้อมูลรถ (Form) -->
            <div id="sectionAdd" class="lg:col-span-5 hidden lg:block">
                <div class="glass-panel p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-200 lg:sticky lg:top-24 relative overflow-hidden">
                    
                    <div id="editModeAlert" class="hidden absolute top-0 left-0 w-full bg-yellow-500 text-white text-xs font-semibold py-1.5 text-center shadow-sm">
                        <i class="fa-solid fa-pen-to-square mr-1"></i> โหมดแก้ไขข้อมูล
                    </div>

                    <h2 id="formTitle" class="text-lg font-semibold text-slate-800 mb-6 flex items-center gap-2 border-b border-slate-100 pb-4 mt-2">
                        <i class="fa-solid fa-file-circle-plus text-secondary" id="formTitleIcon"></i> ขึ้นทะเบียนรถ
                    </h2>

                    <div id="duplicateBanner" class="hidden mb-4 bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded-xl text-sm flex items-start gap-3">
                        <i class="fa-solid fa-triangle-exclamation text-yellow-500 mt-0.5 text-lg"></i>
                        <div>
                            <p class="font-bold">พบข้อมูลทะเบียนนี้ในระบบแล้ว!</p>
                            <p class="text-yellow-700 text-xs mt-0.5">ระบบดึงข้อมูลเดิมมาแสดง หากกดปุ่มด้านล่างจะเป็นการ <u>แก้ไขข้อมูลเดิม</u></p>
                        </div>
                    </div>
                    
                    <form id="addVehicleForm" class="flex flex-col gap-5">
                        
                        <div>
                            <label class="block mb-1.5 text-sm font-medium text-slate-700">หมายเลขทะเบียนรถ <span class="text-red-500">*</span></label>
                            <div class="relative flex items-center">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <i class="fa-solid fa-id-card text-slate-400 text-sm"></i>
                                </div>
                                <input type="text" id="licensePlate" required class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-secondary focus:border-secondary block w-full pl-10 pr-12 p-2.5 outline-none transition-all uppercase" placeholder="เช่น กข 1234 กทม.">
                                
                                <button type="button" id="scanCameraBtnForm" class="absolute inset-y-0 right-1 my-1 px-3 text-white bg-slate-400 hover:bg-secondary transition-colors rounded shadow-sm flex items-center justify-center cursor-pointer">
                                    <i class="fa-solid fa-camera"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block mb-1.5 text-sm font-medium text-slate-700">บ้านเลขที่ <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <i class="fa-solid fa-house text-slate-400 text-sm"></i>
                                </div>
                                <input type="text" id="houseNo" required class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-secondary focus:border-secondary block w-full pl-10 p-2.5 outline-none transition-all" placeholder="เช่น 99/1">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block mb-1.5 text-sm font-medium text-slate-700">สีรถ</label>
                                <input type="text" id="carColor" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-secondary focus:border-secondary block w-full p-2.5 outline-none transition-all" placeholder="เช่น ขาว, ดำ">
                            </div>
                            <div>
                                <label class="block mb-1.5 text-sm font-medium text-slate-700">ยี่ห้อรถ</label>
                                <input type="text" id="carBrand" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-secondary focus:border-secondary block w-full p-2.5 outline-none transition-all" placeholder="เช่น Toyota">
                            </div>
                        </div>

                        <div>
                            <label class="block mb-1.5 text-sm font-medium text-slate-700">ประเภทรถ</label>
                            <select id="carType" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-secondary focus:border-secondary block w-full p-2.5 outline-none transition-all cursor-pointer">
                                <option value="" disabled selected>-- เลือกประเภท --</option>
                                <option value="1">รถยนต์</option>
                                <option value="2">มอเตอร์ไซค์</option>
                                <option value="3">รถยนต์ไฟฟ้า</option>
                                <option value="4">อื่นๆ (4)</option>
                            </select>
                        </div>

                        <button type="submit" id="submitBtn" class="text-white bg-primary hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm w-full px-5 py-3.5 mt-2 text-center transition-all flex justify-center items-center gap-2 shadow-md hover:shadow-lg">
                            <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลใหม่
                        </button>
                        
                        <button type="button" id="cancelEditBtn" class="hidden text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium rounded-lg text-sm w-full px-5 py-2.5 text-center transition-all mt-[-10px]">
                            ยกเลิก
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" class="hidden">

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // นำเข้า deleteDoc เพิ่มเติม
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // แก้ไขเครื่องหมายปิดท้าย API KEY ให้ถูกต้องแล้ว 👇
        // ==========================================
        const AIFORTHAI_APIKEY = 'vzNDUnUawYLQjTSYwDLiqsZ6u9z46cIs'; 

        const firebaseConfig = {
            apiKey: "AIzaSyCXuj7Pl1JnBn2Y7BtyzkHHQm4MQH-isrM",
            authDomain: "time-attendance-69699.firebaseapp.com",
            projectId: "time-attendance-69699",
            storageBucket: "time-attendance-69699.firebasestorage.app",
            messagingSenderId: "793986547170",
            appId: "1:793986547170:web:337bfe602d9b3e32f34dbb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const vehiclesCollection = collection(db, "vehicles");

        let vehiclesCache = [];
        let currentEditingId = null;
        let currentCameraTarget = 'search'; 

        // UI Elements
        const syncBadge = document.getElementById('syncBadge');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const addVehicleForm = document.getElementById('addVehicleForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const licensePlateInput = document.getElementById('licensePlate');
        
        // ==========================================
        // ระบบ LPR (กล้องสแกนป้ายทะเบียน)
        // ==========================================
        const hiddenCameraInput = document.getElementById('hiddenCameraInput');
        
        document.getElementById('scanCameraBtnSearch').addEventListener('click', () => {
            currentCameraTarget = 'search';
            hiddenCameraInput.click();
        });
        
        document.getElementById('scanCameraBtnForm').addEventListener('click', () => {
            currentCameraTarget = 'form';
            hiddenCameraInput.click();
        });

        hiddenCameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            Swal.fire({
                title: 'กำลังสแกนป้าย...',
                text: 'AI กำลังประมวลผลรูปภาพ กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading() }
            });

            try {
                const compressedFile = await compressImage(file);
                const formData = new FormData();
                formData.append('uploadfile', compressedFile);

                const response = await fetch('https://api.aiforthai.in.th/lpr-v2', {
                    method: 'POST',
                    headers: { 'Apikey': AIFORTHAI_APIKEY },
                    body: formData
                });

                if (!response.ok) throw new Error('API Request Failed');
                
                const data = await response.json();
                
                if (data && data.length > 0 && data[0].lpr && data[0].lpr !== "none") {
                    const detectedPlate = data[0].lpr;
                    Swal.close();
                    
                    if (currentCameraTarget === 'search') {
                        searchInput.value = detectedPlate;
                        clearSearchBtn.classList.remove('hidden');
                        instantSearch(detectedPlate);
                    } else {
                        licensePlateInput.value = detectedPlate;
                        licensePlateInput.dispatchEvent(new Event('input')); 
                    }
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'สแกนสำเร็จ!',
                        text: `อ่านป้ายทะเบียนได้: ${detectedPlate}`,
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('สแกนไม่สำเร็จ', 'AI มองไม่เห็นป้ายทะเบียนในรูปนี้ กรุณาถ่ายใหม่ให้ชัดเจนขึ้นครับ', 'error');
                }
            } catch (error) {
                console.error('OCR Error:', error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ AI ได้ในขณะนี้', 'error');
            }
            hiddenCameraInput.value = ''; 
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1024;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', 0.7);
                    };
                };
            });
        }

        // ==========================================
        // Real-Time Data Sync 
        // ==========================================
        onSnapshot(vehiclesCollection, (snapshot) => {
            vehiclesCache = [];
            snapshot.forEach((doc) => {
                vehiclesCache.push({ id: doc.id, ...doc.data() });
            });

            syncDot.classList.remove('bg-yellow-400', 'animate-pulse');
            syncDot.classList.add('bg-green-400');
            syncText.textContent = `พร้อมใช้งาน (${vehiclesCache.length} คัน)`;

            if (searchInput.value.trim().length > 0) {
                instantSearch(searchInput.value.trim());
            }
        });

        // ==========================================
        // ฟังก์ชันลบข้อมูล (เพิ่มใหม่)
        // ==========================================
        window.deleteVehicle = function(id, plate) {
            Swal.fire({
                title: 'ยืนยันการลบข้อมูล?',
                text: `คุณต้องการลบข้อมูลของรถทะเบียน ${plate} ใช่หรือไม่? (ลบแล้วกู้คืนไม่ได้)`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444', // สีแดง
                cancelButtonColor: '#94a3b8', // สีเทา
                confirmButtonText: 'ใช่, ลบทิ้งเลย',
                cancelButtonText: 'ยกเลิก'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        // ส่งคำสั่งลบไปที่ Firebase
                        await deleteDoc(doc(db, "vehicles", id));
                        Swal.fire('ลบสำเร็จ!', `ลบข้อมูลรถทะเบียน ${plate} เรียบร้อยแล้ว`, 'success');
                        
                        // ถ้ารถที่ลบกำลังถูกเปิดแก้ไขค้างอยู่ในฟอร์ม ให้เคลียร์ฟอร์มทิ้งด้วย
                        if (currentEditingId === id) {
                            resetFormToCreateMode();
                        }
                    } catch (error) {
                        console.error("Delete Error:", error);
                        Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถลบข้อมูลได้', 'error');
                    }
                }
            });
        };

        function instantSearch(keyword) {
            const rawKey = keyword.trim().toLowerCase();
            const cleanKey = rawKey.replace(/\s+/g, '');
            if (!cleanKey) { renderEmptyState(); return; }

            const matched = vehiclesCache.filter(item => {
                const plate = String(item.licensePlate || '').toLowerCase().replace(/\s+/g, '');
                const house = String(item.houseNo || '').toLowerCase().replace(/\s+/g, '');
                return plate.includes(cleanKey) || house.includes(cleanKey);
            });
            renderResults(matched, keyword);
        }

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.trim().length > 0) {
                clearSearchBtn.classList.remove('hidden');
                instantSearch(val);
            } else {
                clearSearchBtn.classList.add('hidden');
                renderEmptyState();
            }
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            searchInput.focus();
            renderEmptyState();
        });

        licensePlateInput.addEventListener('input', (e) => {
            const inputClean = e.target.value.trim().toLowerCase().replace(/\s+/g, '');
            if (inputClean.length < 2) { resetFormToCreateMode(); return; }

            const found = vehiclesCache.find(item => String(item.licensePlate || '').toLowerCase().replace(/\s+/g, '') === inputClean);
            if (found) setFormToEditMode(found.id, found);
            else resetFormToCreateMode();
        });

        function setFormToEditMode(id, data) {
            currentEditingId = id;
            document.getElementById('houseNo').value = data.houseNo || '';
            document.getElementById('carColor').value = data.color || '';
            document.getElementById('carBrand').value = data.brand || '';
            document.getElementById('carType').value = data.type || '';
            
            document.getElementById('duplicateBanner').classList.remove('hidden');
            document.getElementById('editModeAlert').classList.remove('hidden');
            cancelEditBtn.classList.remove('hidden');
            
            submitBtn.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> อัปเดตข้อมูล (Edit)`;
            submitBtn.classList.replace('bg-primary', 'bg-yellow-600');
            submitBtn.classList.replace('hover:bg-blue-800', 'hover:bg-yellow-700');
            document.getElementById('formTitleIcon').classList.replace('fa-file-circle-plus', 'fa-pen-to-square');
        }

        function resetFormToCreateMode() {
            if (!currentEditingId) return;
            currentEditingId = null;
            const currentPlate = document.getElementById('licensePlate').value;
            addVehicleForm.reset();
            document.getElementById('licensePlate').value = currentPlate;
            
            document.getElementById('duplicateBanner').classList.add('hidden');
            document.getElementById('editModeAlert').classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
            
            submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลใหม่`;
            submitBtn.classList.replace('bg-yellow-600', 'bg-primary');
            submitBtn.classList.replace('hover:bg-yellow-700', 'hover:bg-blue-800');
            document.getElementById('formTitleIcon').classList.replace('fa-pen-to-square', 'fa-file-circle-plus');
        }

        cancelEditBtn.addEventListener('click', () => {
            currentEditingId = true;
            document.getElementById('licensePlate').value = '';
            resetFormToCreateMode();
        });

        addVehicleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                houseNo: document.getElementById('houseNo').value.trim(),
                licensePlate: document.getElementById('licensePlate').value.trim(),
                searchPlate: document.getElementById('licensePlate').value.trim().toLowerCase(),
                color: document.getElementById('carColor').value.trim(),
                brand: document.getElementById('carBrand').value.trim(),
                type: document.getElementById('carType').value
            };
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...`;
            submitBtn.disabled = true;

            try {
                if (currentEditingId) {
                    await updateDoc(doc(db, "vehicles", currentEditingId), { ...payload, updatedAt: serverTimestamp() });
                    Swal.fire({ icon: 'success', title: 'อัปเดตเรียบร้อย!', text: `ทะเบียน ${payload.licensePlate}`, confirmButtonColor: '#eab308' });
                } else {
                    await addDoc(vehiclesCollection, { ...payload, createdAt: serverTimestamp() });
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', text: `เพิ่มรถทะเบียน ${payload.licensePlate}`, confirmButtonColor: '#3b82f6' });
                }
                currentEditingId = true; resetFormToCreateMode(); document.getElementById('licensePlate').value = '';
                if (window.innerWidth < 1024) window.switchTab('search');
                searchInput.value = payload.licensePlate; clearSearchBtn.classList.remove('hidden'); instantSearch(payload.licensePlate);
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message });
            } finally {
                submitBtn.innerHTML = originalBtnHtml; submitBtn.disabled = false;
            }
        });

        window.switchTab = function(tabName) {
            if (window.innerWidth >= 1024) return;
            const tabSearch = document.getElementById('tabSearch'), tabAdd = document.getElementById('tabAdd');
            const sectionSearch = document.getElementById('sectionSearch'), sectionAdd = document.getElementById('sectionAdd');
            if (tabName === 'search') {
                tabSearch.classList.replace('text-slate-400', 'text-primary'); tabSearch.classList.replace('border-transparent', 'border-primary');
                tabAdd.classList.replace('text-primary', 'text-slate-400'); tabAdd.classList.replace('border-primary', 'border-transparent');
                sectionSearch.classList.replace('hidden', 'flex'); sectionAdd.classList.replace('block', 'hidden');
            } else {
                tabAdd.classList.replace('text-slate-400', 'text-primary'); tabAdd.classList.replace('border-transparent', 'border-primary');
                tabSearch.classList.replace('text-primary', 'text-slate-400'); tabSearch.classList.replace('border-primary', 'border-transparent');
                sectionAdd.classList.replace('hidden', 'block'); sectionSearch.classList.replace('flex', 'hidden');
            }
        };

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('sectionSearch').classList.replace('hidden', 'flex');
                document.getElementById('sectionAdd').classList.replace('hidden', 'block');
            }
        });

        window.triggerEditFromSearch = function(plate) {
            if (window.innerWidth < 1024) window.switchTab('add');
            document.getElementById('licensePlate').value = plate;
            document.getElementById('licensePlate').dispatchEvent(new Event('input', { bubbles: true }));
        };

        function renderResults(data, keyword) {
            if (!data || data.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-12 text-slate-500 bg-white rounded-2xl shadow-sm border border-slate-200"><i class="fa-regular fa-face-frown-open text-4xl mb-3 text-slate-300"></i><p class="font-medium text-lg">ไม่พบข้อมูล</p></div>`;
                return;
            }
            let html = `<p class="text-sm text-slate-500 mb-1 pl-1">พบผลลัพธ์ <span class="font-semibold text-primary">${data.length}</span> รายการ</p>`;
            data.forEach(item => {
                let carIcon = 'fa-car', typeStr = String(item.type || '');
                if (typeStr.includes('มอเตอร์ไซค์') || typeStr === '2') carIcon = 'fa-motorcycle';
                else if (typeStr.includes('ไฟฟ้า') || typeStr === '3') carIcon = 'fa-plug-circle-bolt'; 
                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 relative group">
                        <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                            <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-secondary shrink-0"><i class="fa-solid ${carIcon} text-xl"></i></div>
                            <div class="flex-grow w-full">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="text-xl font-bold text-slate-800">${item.licensePlate}</h3>
                                    <span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-md font-medium border border-slate-200"><i class="fa-solid fa-house text-slate-400 mr-1"></i> ${item.houseNo}</span>
                                </div>
                                <div class="flex flex-wrap gap-x-4 gap-y-2 mt-2 text-sm text-slate-500">
                                    <div><i class="fa-solid fa-palette text-slate-400"></i> ${item.color || '-'}</div>
                                    <div><i class="fa-regular fa-copyright text-slate-400"></i> ${item.brand || '-'}</div>
                                </div>
                            </div>
                            <!-- เพิ่มปุ่มลบ (ถังขยะ) ถัดจากปุ่มแก้ไข -->
                            <div class="mt-3 sm:mt-0 w-full sm:w-auto flex gap-2 justify-end">
                                <button onclick="triggerEditFromSearch('${item.licensePlate}')" class="text-xs font-medium text-slate-500 bg-slate-50 hover:bg-blue-50 px-3 py-2 rounded-lg border border-slate-200 flex-1 sm:flex-none transition-colors"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                                <button onclick="deleteVehicle('${item.id}', '${item.licensePlate}')" class="text-xs font-medium text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg border border-red-200 flex-1 sm:flex-none transition-colors"><i class="fa-solid fa-trash"></i> ลบ</button>
                            </div>
                        </div>
                    </div>`;
            });
            resultsContainer.innerHTML = html;
        }

        function renderEmptyState() { 
            resultsContainer.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-300 shadow-sm"><i class="fa-solid fa-car text-4xl mb-3 text-slate-200"></i><p>พิมพ์ข้อมูลหรือกดกล้องเพื่อค้นหา</p></div>`; 
        }
    </script>
</body>
</html>
